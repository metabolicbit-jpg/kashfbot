name: Deploy Worker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check index.js
        run: |
          if node --check index.js 2> err.log; then
            echo "✅ SYNTAX OK" | tee -a $GITHUB_STEP_SUMMARY
          else
            echo "❌ SYNTAX ERROR در index.js:" | tee -a $GITHUB_STEP_SUMMARY
            echo '```' | tee -a $GITHUB_STEP_SUMMARY
            cat err.log | tee -a $GITHUB_STEP_SUMMARY
            echo '```' | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          wrangler deploy 2>&1 | tee deploy.log
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Sync Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          WALLET_TOKEN: ${{ secrets.WALLET_TOKEN }}
        run: |
          printf '%s' "$BALE_BOT_TOKEN" | wrangler secret put BALE_BOT_TOKEN
          printf '%s' "$WALLET_TOKEN" | wrangler secret put WALLET_TOKEN