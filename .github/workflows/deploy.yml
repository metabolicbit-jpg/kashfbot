name: Deploy Worker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show lines 280-305 of index.js
        run: |
          echo "### 🔍 Lines 280-305 of index.js" >> $GITHUB_STEP_SUMMARY
          echo '```js' >> $GITHUB_STEP_SUMMARY
          sed -n '280,305p' index.js >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📏 Total lines" >> $GITHUB_STEP_SUMMARY
          wc -l index.js >> $GITHUB_STEP_SUMMARY

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          wrangler deploy > deploy.log 2>&1
          code=$?
          echo "### 📤 Wrangler output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code

      - name: Sync Secrets
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          WALLET_TOKEN: ${{ secrets.WALLET_TOKEN }}
        run: |
          printf '%s' "$BALE_BOT_TOKEN" | wrangler secret put BALE_BOT_TOKEN
          printf '%s' "$WALLET_TOKEN" | wrangler secret put WALLET_TOKEN