name: Deploy Worker

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check (ESM)
        run: |
          set +e
          cp index.js /tmp/check.mjs
          node --check /tmp/check.mjs 2> err.log
          code=$?
          if [ $code -ne 0 ]; then
            echo "### ❌ خطای سینتکس در index.js" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat err.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### ✅ سینتکس سالم" >> $GITHUB_STEP_SUMMARY

      - name: Completeness check
        run: |
          miss=""
          for fn in handleStart handleMenu handleStateText handleCb handleAdmin handleAdminUsers handleAdminChannels handleAdminMissions handleAdminEngage handleAdminTxs handleAdminReports handleAdminEconomy handleAdminQuota showDiscover handleForward handlePayment ctx_broadcast seedMissions missionsHandler submitReport runCron route; do
            if ! grep -q "function $fn(" index.js; then miss="$miss $fn"; fi
          done
          if [ -n "$miss" ]; then
            echo "### ❌ توابع جاافتاده در پیست:$miss" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "### ✅ همهٔ توابع حاضرند" >> $GITHUB_STEP_SUMMARY

      - name: Install Wrangler
        run: npm install -g wrangler@3

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          wrangler deploy > deploy.log 2>&1
          code=$?
          echo "### 📤 خروجی Wrangler" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat deploy.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $code

      - name: Sync Secrets
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          WALLET_TOKEN: ${{ secrets.WALLET_TOKEN }}
        run: |
          printf '%s' "$BALE_BOT_TOKEN" | wrangler secret put BALE_BOT_TOKEN
          printf '%s' "$WALLET_TOKEN" | wrangler secret put WALLET_TOKEN